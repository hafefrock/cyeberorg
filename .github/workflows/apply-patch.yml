name: Apply patch (maintenance)

# If "patch.diff" exists in the root of branch "dev", apply it, delete the file, commit and
# push to "dev", then start the APK build. Used to change large files without re-uploading them.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Apply patch.diff and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f patch.diff ]; then echo "No patch.diff on dev, nothing to do."; exit 1; fi
          if grep -E '^(\+\+\+|---) [ab]/\.github/' patch.diff; then
            echo "Patch touches .github, which this job cannot push."; exit 1
          fi
          git apply --index --whitespace=nowarn patch.diff
          git rm -q --cached patch.diff
          rm patch.diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply patch.diff"
          git push origin dev
          # Pushes made with GITHUB_TOKEN do not start other workflows, so start the build here.
          gh workflow run build.yml --ref dev
