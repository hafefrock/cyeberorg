name: Apply patch (maintenance)

# Applies "patch.diff" from a given branch onto main and pushes the result to a new
# branch "apply/<patch-branch>". Used to change large files without re-uploading them.
on:
  workflow_dispatch:
    inputs:
      patch_branch:
        description: "Branch that contains patch.diff (for example patch/tagline)"
        required: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch and push branch
        env:
          PATCH_BRANCH: ${{ inputs.patch_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$PATCH_BRANCH"
          git show "origin/$PATCH_BRANCH:patch.diff" > "$RUNNER_TEMP/change.diff"
          if grep -E '^(\+\+\+|---) [ab]/\.github/' "$RUNNER_TEMP/change.diff"; then
            echo "Patch touches .github, which this job cannot push."; exit 1
          fi
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/change.diff"
          NEW_BRANCH="apply/$(echo "$PATCH_BRANCH" | tr '/' '-')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$NEW_BRANCH"
          git commit -m "Apply patch from $PATCH_BRANCH"
          git push origin "$NEW_BRANCH"
