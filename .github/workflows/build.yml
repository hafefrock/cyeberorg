name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME). Only the licenses need
      # accepting; the Android platform and build-tools are downloaded by Gradle on demand.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # The Gradle wrapper script/jar are not in the repository yet, so install the
      # same Gradle version as gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # debug.keystore is git-ignored. Generate the standard Android debug key so the
      # "debugConfig" signing config in app/build.gradle.kts can sign the APKs.
      # This is a throw-away debug key, NOT a release key.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug and fast APKs
        run: gradle assembleDebug assembleFast --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload fast APK
        uses: actions/upload-artifact@v4
        with:
          name: app-fast-apk
          path: app/build/outputs/apk/fast/*.apk
          if-no-files-found: error
          retention-days: 14
