name: Build APK

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME). Only the licenses need
      # accepting; the Android platform and build-tools are downloaded by Gradle on demand.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # The Gradle wrapper script/jar are not in the repository yet, so install the
      # same Gradle version as gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # debug.keystore is git-ignored. If the repository secret DEBUG_KEYSTORE_BASE64 exists,
      # use it so every build is signed with the SAME key (APKs then update over each other
      # without uninstalling). Otherwise generate a throw-away key (each build differs).
      # This is a debug key, NOT a release key.
      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Using the stored debug keystore"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a throw-away debug keystore (set DEBUG_KEYSTORE_BASE64 for a stable one)"
          fi

      - name: Build debug and fast APKs
        run: gradle assembleDebug assembleFast --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload fast APK
        uses: actions/upload-artifact@v4
        with:
          name: app-fast-apk
          path: app/build/outputs/apk/fast/*.apk
          if-no-files-found: error
          retention-days: 14
