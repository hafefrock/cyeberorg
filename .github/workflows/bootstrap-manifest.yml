name: Update bootstrap manifest

# Looks up a Termux bootstrap release, downloads the four archives, records their SHA-256 in
# app/src/main/assets/bootstrap-manifest.json and commits that file to the "dev" branch.
# The app later downloads the archive and refuses it if the hash does not match.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Bootstrap release tag (leave empty for the newest one)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Build manifest
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          REPO="termux/termux-packages"
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/$REPO/releases?per_page=30" \
              --jq '[.[] | select(.tag_name | startswith("bootstrap-")) | select(.draft | not)][0].tag_name')"
          fi
          echo "Using release tag: $TAG"
          TAG_ENC="${TAG//+/%2B}"
          gh api "repos/$REPO/releases/tags/$TAG_ENC" > "$RUNNER_TEMP/release.json"
          echo "Assets in this release:"
          python3 -c "import json,sys; [print(' ',a['name'],a['size']) for a in json.load(open(sys.argv[1]))['assets']]" "$RUNNER_TEMP/release.json"
          mkdir -p "$RUNNER_TEMP/dl"
          python3 - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/dl" "$TAG" <<'PY'
          import hashlib, json, os, sys, urllib.request, zipfile
          release_file, dl_dir, tag = sys.argv[1:4]
          release = json.load(open(release_file))
          wanted = ["aarch64", "arm", "i686", "x86_64"]
          by_name = {a["name"]: a for a in release["assets"]}
          archives = {}
          for arch in wanted:
              name = "bootstrap-%s.zip" % arch
              if name not in by_name:
                  sys.exit("Missing asset %s in release %s" % (name, tag))
              asset = by_name[name]
              path = os.path.join(dl_dir, name)
              urllib.request.urlretrieve(asset["browser_download_url"], path)
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              with zipfile.ZipFile(path) as z:
                  if "SYMLINKS.txt" not in z.namelist():
                      sys.exit("%s has no SYMLINKS.txt" % name)
              archives[arch] = {
                  "url": asset["browser_download_url"],
                  "sha256": h.hexdigest(),
                  "size": os.path.getsize(path),
              }
              print(arch, archives[arch]["sha256"], archives[arch]["size"])
          os.makedirs("app/src/main/assets", exist_ok=True)
          with open("app/src/main/assets/bootstrap-manifest.json", "w") as out:
              json.dump({"tag": tag, "archives": archives}, out, indent=2)
              out.write("\n")
          PY

      - name: Commit manifest to dev
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/bootstrap-manifest.json
          if git diff --cached --quiet; then echo "Manifest unchanged"; exit 0; fi
          git commit -m "Update Termux bootstrap manifest"
          git push origin dev
