name: Rename to Cyberorg (one-time)

# One-off job: renames every "HackerStudio" to "Cyberorg" (files, folders and text),
# commits the result to a new branch "rename/cyberorg". Delete this file afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rename
        shell: bash
        run: |
          set -euo pipefail
          # Never touch the workflow files themselves (this job cannot push changes to .github/workflows)
          FILES() { git ls-files -z -- . ':(exclude).github'; }
          # 1) rename files/folders whose name contains the old name
          while IFS= read -r p; do
            new="$(dirname "$p")/$(basename "$p" | sed -e 's/HackerStudio/Cyberorg/g' -e 's/hackerstudio/cyberorg/g')"
            git mv "$p" "$new"
          done < <(FILES | tr '\0' '\n' | grep -i 'hackerstudio' || true)
          # 2) replace the name inside text files (binary files are skipped by grep -I)
          FILES | xargs -0 grep -IlZ -i 'hacker.\?studio' | xargs -0 -r sed -i -E \
            -e 's/HackerStudio/Cyberorg/g' \
            -e 's/hackerStudio/cyberorg/g' \
            -e 's/hackerstudio/cyberorg/g' \
            -e 's/Hacker Studio/Cyberorg/g'
          # 3) fail if anything is left behind (file names or contents)
          if FILES | tr '\0' '\n' | grep -i 'hacker.\?studio'; then echo "Leftover file names"; exit 1; fi
          if FILES | xargs -0 grep -In -i 'hacker.\?studio'; then echo "Leftover text"; exit 1; fi

      - name: Commit and push branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c rename/cyberorg
          git add -A
          git commit -m "Rename HackerStudio to Cyberorg"
          git push origin rename/cyberorg
